spring:
  application:
    name: task-system-api

  # Local development: H2 database stored on disk (./data) so the state survives restarts.
  # Docker runs with the "docker" profile (application-docker.yml), which switches to PostgreSQL.
  datasource:
    url: jdbc:h2:file:./data/tasksystem
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    mapper:
      # The frontend sends both camelCase and PascalCase payloads
      # (a leftover of the previous backend), so accept both.
      accept-case-insensitive-properties: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 6901

# API documentation: OpenAPI schema at /v3/api-docs, Swagger UI at /swagger-ui.html.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Group endpoints by @Tag and sort operations by HTTP method instead of declaration order.
    tags-sorter: alpha
    operations-sorter: method
    # Keep the pasted access token across page reloads.
    persist-authorization: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  version: 0.1.0-java
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  demo:
    # Creates demo accounts, teams, projects, issues and comments on an empty database.
    # Also enables one-click demo sign-in (POST /api/v1/auth/demo).
    seed: ${APP_DEMO_SEED:false}
    account-email: ${APP_DEMO_ACCOUNT_EMAIL:demo@tasksystem.local}
  security:
    jwt:
      # Development-only default; override with the APP_SECURITY_JWT_SECRET
      # environment variable (min. 32 bytes).
      secret: ${APP_SECURITY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
