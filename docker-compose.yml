# TaskSystem: PostgreSQL + Spring Boot API + React frontend (nginx).
# Start everything:  docker compose up --build
# Then open:         http://localhost:8080  (or the APP_PORT from .env)
name: tasksystem

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasksystem}
      POSTGRES_USER: ${POSTGRES_USER:-tasksystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasksystem}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host on purpose, so it never clashes with a local PostgreSQL on 5432.
    # Uncomment to inspect the database with psql/pgAdmin at localhost:5433.
    # ports:
    #   - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tasksystem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tasksystem}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tasksystem}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      APP_DEMO_SEED: ${DEMO_SEED:-true}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
    # The API is reached through the frontend's /api proxy. Uncomment to call it directly.
    # ports:
    #   - "6901:6901"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
